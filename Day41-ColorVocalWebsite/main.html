<!DOCTYPE html>
<html>
<head>

    <title>Color Vocal</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Colors</h1>
    <h2>Learn the colors in Spanish!</h2>

    <h2 id="red">Rojo</h2>
    <img src="red.png" alt="Rojo" />

    <h2 id="blue">Azul</h2>
    <img src="blue.png" alt="Azul" />

    <h2 id="orange">Anaranjado</h2>
    <img src="orange.png" alt="Anaranjado" />

    <h2 id="green">Verde</h2>

    <img src="yellow.png" alt="Amarillo" />
</body>
</html>
