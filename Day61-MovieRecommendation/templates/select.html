{% for movie in options %}
  <div style=" background: #fff;
  border-radius: 12px;
  padding: 1.5rem;
  margin: 1rem;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  transition: transform 0.2s ease, box-shadow 0.3s ease;
  display=flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  max-width: 300px;">
    <h3>{{ movie.Title }} ({{ movie.Year }})</h3>
    <img src="{{ movie.Poster }}" width="100">
    <form action="{{ url_for('find_movie') }}" method="get">
      <input type="hidden" name="id" value="{{ movie.imdbID }}">
      <button type="submit" style="margin-top:1rem;">Add to Collection</button>
    </form>
  </div>
{% endfor %}
